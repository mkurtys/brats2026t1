[project]
name = "mbrats"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.2,!=2.9.*",
    "nibabel>=5.0",
    "panoptica>=2.1",
    "BraTS_evaluation>=0.0.8",
    "threadpoolctl",
    "acvl-utils>=0.2.6,<0.3",  # 0.3 may bring breaking changes. Careful!
    "dynamic-network-architectures>=0.4.4,<0.5",
    "tqdm",
    "scipy",
    "batchgenerators>=0.25.1",
    "numpy>=1.24",
    "scikit-learn",
    "scikit-image>=0.19.3",
    "SimpleITK>=2.2.1",
    "pandas",
    "graphviz",
    'tifffile',
    'requests',
    "matplotlib",
    "seaborn",
    "imagecodecs",
    "yacs",
    "batchgeneratorsv2>=0.3.2",
    "einops",
    "blosc2>=3.3.2"
]

[build-system]
requires = ["setuptools>=67.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mbrats*"]
